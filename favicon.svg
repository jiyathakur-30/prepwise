<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Glowing gradients -->
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFF" />
      <stop offset="100%" stop-color="#00D4FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background circular subtle container -->
  <rect width="512" height="512" rx="128" fill="#070913" />
  <!-- Overlapping glowing AI diamond sparks -->
  <g transform="translate(136, 136)" filter="url(#glow)">
    <!-- Outer accent path -->
    <path d="M 120 0 L 240 120 L 120 240 L 0 120 Z" fill="none" stroke="url(#cyber-grad)" stroke-width="16" stroke-linejoin="round" />
    <!-- Inner core spark -->
    <path d="M 120 40 L 200 120 L 120 200 L 40 120 Z" fill="url(#cyber-grad)" opacity="0.85" />
    <!-- Soundwave/Signal frequency nodes in center -->
    <circle cx="120" cy="120" r="16" fill="#070913" />
    <path d="M 100 120 L 140 120" stroke="#070913" stroke-width="4" stroke-linecap="round" />
    <path d="M 120 100 L 120 140" stroke="#070913" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>