<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>PrepWise Routing Redirect</title>
    <script type="text/javascript">
      // SPA redirect script for GitHub Pages
      var l = window.location;
      var pathSegment = 'prepwise';
      
      var pathArray = l.pathname.split('/');
      var repoIndex = pathArray.indexOf(pathSegment);
      
      var base = pathArray.slice(0, repoIndex + 1).join('/');
      var route = pathArray.slice(repoIndex + 1).join('/');
      
      var redirectUrl = l.protocol + '//' + l.host + base + '/';
      
      if (route) {
        redirectUrl += '?p=' + encodeURIComponent(route).replace(/&/g, '~and~');
      }
      if (l.search) {
        redirectUrl += '&q=' + encodeURIComponent(l.search.slice(1)).replace(/&/g, '~and~');
      }
      if (l.hash) {
        redirectUrl += l.hash;
      }
      
      l.replace(redirectUrl);
    </script>
  </head>
  <body>
    Redirecting to PrepWise...
  </body>
</html>
